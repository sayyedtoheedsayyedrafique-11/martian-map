<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="fav-mars" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <radialGradient id="fav-moon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </radialGradient>
    <linearGradient id="fav-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Telemetry Reticle Ticks -->
  <line x1="15.5" y1="1.5" x2="15.5" y2="4" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.85" />
  <line x1="15.5" y1="28" x2="15.5" y2="30.5" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.65" />
  <line x1="1.5" y1="16" x2="4" y2="16" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.65" />
  <line x1="28" y1="16" x2="30.5" y2="16" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.85" />

  <!-- Rear Orbital Arc -->
  <path d="M 6.5 19.5 C 5.2 14.8 9.5 10.2 16.8 8.6 C 22.8 7.3 27.5 9.2 28.5 13.2" fill="none" stroke="#f59e0b" stroke-width="1.1" stroke-dasharray="2.2 1.5" opacity="0.45" />

  <!-- Mars Celestial Sphere -->
  <circle cx="15.5" cy="16" r="7.8" fill="url(#fav-mars)" stroke="#271007" stroke-width="0.8" />

  <!-- Polar Cap -->
  <path d="M 12.2 9.4 C 13.6 8.8 16.8 8.8 18.2 9.4 C 17.2 10.2 13.2 10.2 12.2 9.4 Z" fill="#ffedd5" opacity="0.88" />

  <!-- Valles Canyon -->
  <path d="M 11.5 17 Q 15 18.8 19.2 15.8" fill="none" stroke="#2a0c05" stroke-width="1" stroke-linecap="round" opacity="0.65" />

  <!-- Front Orbital Arc -->
  <path d="M 28.5 13.2 C 29.5 17.8 24.8 23 16.8 24.6 C 10 26 5.5 23.8 4.2 19.5" fill="none" stroke="url(#fav-orbit)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Trajectory Node -->
  <circle cx="6.8" cy="22.2" r="1.1" fill="#f59e0b" />

  <!-- Orbiting Moon (Phobos) -->
  <circle cx="25.5" cy="11.2" r="2.4" fill="url(#fav-moon)" stroke="#0a0b0d" stroke-width="0.6" />
  <circle cx="24.9" cy="10.8" r="0.65" fill="#374151" opacity="0.85" />
</svg>
